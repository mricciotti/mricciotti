<svg width="760" height="170" viewBox="0 0 760 170" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3366ff"/>
      <stop offset="100%" stop-color="#b967ff"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05050a"/>
      <stop offset="100%" stop-color="#12121e"/>
    </linearGradient>
    <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M 26 0 L 0 0 0 26" fill="none" stroke="#1d1d2b" stroke-width="1"/>
    </pattern>
    <clipPath id="panelClip">
      <rect width="760" height="170" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#panelClip)">
    <rect width="760" height="170" fill="url(#bgGrad)"/>
    <rect width="760" height="170" fill="url(#grid)"/>
  </g>

  <rect x="1" y="1" width="758" height="168" rx="15" fill="none" stroke="#2a2a3c" stroke-width="1.5"/>

  <!-- HUD corner brackets -->
  <path d="M 20 34 L 20 20 L 34 20" fill="none" stroke="#3366ff" stroke-width="2.5"/>
  <path d="M 726 20 L 740 20 L 740 34" fill="none" stroke="#3366ff" stroke-width="2.5"/>
  <path d="M 20 136 L 20 150 L 34 150" fill="none" stroke="#3366ff" stroke-width="2.5"/>
  <path d="M 740 136 L 740 150 L 726 150" fill="none" stroke="#3366ff" stroke-width="2.5"/>

  <text x="40" y="40" font-family="Consolas, 'Courier New', monospace" font-size="11" letter-spacing="3" fill="#5b6b9c">
    &lt;/&gt; PROFILE.INIT
    <animate attributeName="opacity" values="0;1" dur="0.6s" begin="0.1s" fill="freeze"/>
  </text>

  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.5;1" dur="1s" begin="0.4s" fill="freeze"/>
    <text x="40" y="92" font-family="Consolas, 'Courier New', monospace" font-size="30" font-weight="700" fill="url(#textGrad)">Hi 👋 I'm Matheus Ricciotti</text>
  </g>

  <rect x="536" y="70" width="14" height="30" fill="#3366ff">
    <animate attributeName="opacity" values="0;0;1;0" keyTimes="0;0.45;0.5;1" dur="1s" begin="0s" repeatCount="1" fill="freeze"/>
    <animate attributeName="opacity" values="1;0;1" dur="1s" begin="1.4s" repeatCount="indefinite"/>
  </rect>

  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="1.5s" fill="freeze"/>
    <text x="40" y="128" font-family="Consolas, 'Courier New', monospace" font-size="15" fill="#c7cbe0">Front-end Developer @ Editora Globo · Engenharia de Software (FIAP)</text>
  </g>
</svg>
